name: Admittedly
description: 'myOptions (myoptions.org redirects to encourageme.com; operated as the
  Encourage platform by Encoura, LLC) is a free college and career planning platform
  for middle- and high-school students, families, and educators across the United States.
  Students explore colleges, majors, careers, and scholarships and get matched to institutions,
  while educators deliver guidance through lesson plans, preference forms, and reporting
  dashboards. The platform reports serving roughly 4 million students across 5,000 school
  districts and 10,000+ high schools in all 50 states and D.C., funded through partnerships
  with colleges and education providers rather than user fees. It publishes no public
  developer API, SDK, OpenAPI, or documentation surface, and no real /.well-known/ documents
  (all such paths return the SPA/404 catch-all). Surfaced in the API Evangelist network
  as a 500 Global portfolio lead under the stub slug ''admittedly''.'
